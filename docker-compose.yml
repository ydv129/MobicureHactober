version: "3.8"
services:
  app:
    build: .
    ports:
      - "3000:3000"
    env_file:
      - .env.local
    environment:
      NODE_ENV: production
    restart: unless-stopped
  python-apk:
    image: python:3.11-slim
    working_dir: /services
    volumes:
      - ./services:/services
    command: bash -c "pip install -r requirements.txt && python apk_analyzer_service.py"
    ports:
      - "8001:8001"
    restart: unless-stopped
